services:
  # ---------------------------------------------------------------------------
  # Local Postgres (pgvector) — DISABLED in favor of Supabase.
  # Set Supabase pooler vars in .env (recommended) or a full DATABASE_URL fallback.
  # fully local stack, uncomment this service, re-add the `db` dependency under
  # `web`, uncomment the `postgres_data` volume, and point DATABASE_URL at it.
  # ---------------------------------------------------------------------------
  # db:
  #   image: pgvector/pgvector:pg16
  #   container_name: tagr-db
  #   env_file: .env
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-tagr_db}
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./tagr_schema_v1.sql:/docker-entrypoint-initdb.d/init.sql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d tagr_db"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  storage:
    image: minio/minio:latest
    container_name: tagr-storage
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
      args:
        TARGET: dev
    container_name: tagr-inference
    env_file: .env
    environment:
      - INFERENCE_DEVICE=${INFERENCE_DEVICE:-cpu}
    command:
      - python
      - -u
      - main.py
      - --rp_serve_api
      - --rp_api_host
      - 0.0.0.0
      - --rp_api_port
      - "8001"
    ports:
      - "${INFERENCE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  web:
    build: .
    container_name: tagr-web
    env_file: .env
    environment:
      # Supavisor pooler (built into DATABASE_URL when SUPABASE_POOLER_* vars are set).
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_POOLER_HOST: ${SUPABASE_POOLER_HOST:-}
      SUPABASE_POOLER_PORT: ${SUPABASE_POOLER_PORT:-6543}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tagr-bucket}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      INFERENCE_SERVER_URL: ${INFERENCE_SERVER_URL:-http://inference:8001}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-30}
      INFERENCE_BATCH_TIMEOUT_SECONDS: ${INFERENCE_BATCH_TIMEOUT_SECONDS:-120}
      API_CALLBACK_URL: ${API_CALLBACK_URL:-http://web:8000/api/v1/internal/inference-callback}
      BATCH_SIZE: ${BATCH_SIZE:-10}
      BATCH_TIMEOUT_MS: ${BATCH_TIMEOUT_MS:-50}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    ports:
      - "${WEB_PORT:-8787}:8000"
    depends_on:
      # db dependency removed: using external Supabase Postgres.
      storage:
        condition: service_healthy
      inference:
        condition: service_started
    volumes:
      - ./app:/workspace/app

  # Optional: Cloudflare Tunnel (public HTTPS URL without opening ports)
  # Quick tunnel (no account):  docker compose --profile tunnel up cloudflared
  # Named tunnel (your domain): set CLOUDFLARE_TUNNEL_TOKEN in .env, then:
  #   docker compose --profile tunnel up cloudflared-named
  # Or run locally:             ./scripts/cloudflare-tunnel.sh
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tagr-cloudflared
    profiles: ["tunnel"]
    network_mode: host
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://127.0.0.1:8787

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: tagr-cloudflared-named
    profiles: ["tunnel"]
    network_mode: host
    env_file: .env
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  # postgres_data:   # re-enable with the local `db` service above
  minio_data:
