services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tagr-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tagr_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tagr_schema_v1.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tagr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    container_name: tagr-storage
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
      args:
        TARGET: dev
    container_name: tagr-inference
    env_file: .env
    environment:
      - INFERENCE_DEVICE=cpu
    command:
      - python
      - -u
      - main.py
      - --rp_serve_api
      - --rp_api_host
      - 0.0.0.0
      - --rp_api_port
      - "8001"
    ports:
      - "${INFERENCE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    build: ./v1-migration-backend
    container_name: tagr-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tagr_db}
      JWT_SECRET: ${JWT_SECRET:-tagr-super-secret-key-12345}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tagr-bucket}
      INFERENCE_URL: http://inference:8001
      API_CALLBACK_URL: http://worker:8787/api/v1/internal/inference-callback
    ports:
      - "${WORKER_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      inference:
        condition: service_started
    volumes:
      - ./v1-migration-backend/src:/app/src
      - ./v1-migration-backend/public:/app/public
      - ./v1-migration-backend/wrangler.toml:/app/wrangler.toml

volumes:
  postgres_data:
  minio_data:
