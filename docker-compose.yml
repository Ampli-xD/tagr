services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tagr-db
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tagr_schema_v1.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tagr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    container_name: tagr-storage
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    env_file: .env

    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT:-9000}/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tagr-web
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/tagr_db
      - MINIO_HOST=storage
      - STORAGE_ENDPOINT=http://storage:9000
      - INFERENCE_HOST=inference
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      inference:
        condition: service_started
    volumes:
      - ./app:/workspace/app

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
      args:
        TARGET: dev
    container_name: tagr-inference
    env_file: .env
    environment:
      - INFERENCE_DEVICE=cpu
    command:
      - python
      - -u
      - main.py
      - --rp_serve_api
      - --rp_api_host
      - 0.0.0.0
      - --rp_api_port
      - "8001"
    ports:
      - "${INFERENCE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  postgres_data:
  minio_data:
