[project]
name = "tagr-api-worker"
version = "0.1.0"
description = "Tagr API — Cloudflare Worker (Python)"
requires-python = ">=3.12"
dependencies = [
    "pg8000>=1.31.2",
    "PyJWT>=2.8.0",
]

[dependency-groups]
dev = [
    "workers-py>=1.0.0",
    "workers-runtime-sdk",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]
