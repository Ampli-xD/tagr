name = "tagr-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "BATCHER"
class_name = "PhotoBatcher"

[[migrations]]
tag = "v1"
new_classes = ["PhotoBatcher"]

[vars]
BATCH_SIZE = "10"
BATCH_TIMEOUT_MS = "50"
SIMILARITY_THRESHOLD = "0.35"
JWT_SECRET = "tagr-super-secret-key-12345"
STORAGE_BUCKET = "tagr-bucket"
STORAGE_ACCESS_KEY = "minioadmin"
STORAGE_SECRET_KEY = "minioadmin"

[dev]
port = 8787
ip = "0.0.0.0"
