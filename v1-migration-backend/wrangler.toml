name = "tagr-api"
main = "src/entry.py"
compatibility_date = "2025-09-15"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "BATCHER"
class_name = "PhotoBatcher"

[[migrations]]
tag = "v1"
new_classes = ["PhotoBatcher"]

[vars]
BATCH_SIZE = "10"
BATCH_TIMEOUT_MS = "50"
SIMILARITY_THRESHOLD = "0.35"

[dev]
port = 8787
ip = "0.0.0.0"
